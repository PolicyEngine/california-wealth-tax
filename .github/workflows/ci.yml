name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Model tests
        run: bun run test
      - name: Forbes pipeline tests
        run: |
          python -m pip install pytest
          python -m pytest scripts -q
      - name: Snapshot sanity
        run: python scripts/check_snapshot_sanity.py
      # A branch lags main's daily data commits, so staleness only warns here.
      - name: Snapshot freshness
        run: python scripts/check_snapshot_freshness.py ${{ github.event_name == 'pull_request' && '--warn-only' || '' }}
      - run: bun run build
