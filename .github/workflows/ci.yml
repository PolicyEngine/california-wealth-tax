name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Model tests
        run: bun run test
      - name: Forbes pipeline tests
        run: |
          python -m pip install pytest
          python -m pytest scripts/test_fetch_forbes.py -q
      - name: Snapshot sanity
        run: python scripts/check_snapshot_sanity.py
      - name: Snapshot freshness
        run: python scripts/check_snapshot_freshness.py
      - run: bun run build
