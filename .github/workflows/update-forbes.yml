name: Update Forbes data

on:
  schedule:
    - cron: "0 12 * * *" # 12pm UTC / 5am PT daily
  workflow_dispatch: # manual trigger
    inputs:
      allow:
        description: >-
          Plausibility checks to waive after confirming the move is real
          (comma-separated: total-move, roster-churn, frozen-upstream)
        required: false
        default: ""

# A manual dispatch would otherwise race the scheduled run to push. A run that
# starts while another is going waits for it rather than cancelling it.
concurrency:
  group: update-forbes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch CI on the data commit and watch it
      contents: write
      issues: write
    env:
      # The repository had no watchers in October 2026, so a failure issue
      # reached no one unless it named someone. scripts/report_daily_update.py
      # assigns it to this account and mentions it while an outage goes on.
      ALERT_ASSIGNEE: MaxGhenis
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # scripts/test_precompute.py runs lib/incomeTaxLookup.js under bun to check
      # that the app can read the generated lookup. That module imports nothing,
      # so the runtime is enough; no `bun install`.
      - uses: oven-sh/setup-bun@v2

      - name: Test the fetcher before touching data
        run: |
          python -m pip install pytest
          python -m pytest scripts -q

      - name: Fetch latest Forbes data
        run: python scripts/fetch_forbes.py

      - name: Sanity-check the new snapshot before publishing it
        env:
          SNAPSHOT_SANITY_ALLOW: ${{ inputs.allow }}
        run: python scripts/check_snapshot_sanity.py

      - name: Commit and push if changed
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/billionaires_live.json data/billionaires_live_meta.json data/billionaires_live.csv data/roster_valuations.json data/citizenship_by_name.json public/snapshots/ public/roster_valuations/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Forbes data ($(date -u +%Y-%m-%d))"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN starts no workflow run, so the data commit
      # would otherwise reach the branch with no lint, model tests, strict
      # freshness check or build. A workflow_dispatch event is the documented
      # exception. Waiting on the run lets a red CI fail this job, which the
      # report below turns into an issue.
      - name: Run CI on the data commit
        id: ci
        if: steps.publish.outputs.sha != ''
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_COMMIT: ${{ steps.publish.outputs.sha }}
        run: |
          run_id=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" -F return_run_details=true \
            --jq .workflow_run_id)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
          # A dispatch runs on the branch's tip, which is the data commit unless
          # someone pushed in between.
          tested=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          if [ "$tested" != "$DATA_COMMIT" ]; then
            echo "::notice::CI ran on $tested, pushed after data commit $DATA_COMMIT."
          fi

      # Only main's outcome is reported: a test dispatch on a branch neither
      # opens nor closes the outage issue. System python3, not setup-python, so
      # the report runs even if an earlier setup step is what failed.
      - name: Report the failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_COMMIT: ${{ steps.publish.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: python3 scripts/report_daily_update.py failure

      - name: Close the outage issue
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_daily_update.py success
