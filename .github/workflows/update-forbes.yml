name: Update Forbes data

on:
  schedule:
    - cron: "0 12 * * *" # 12pm UTC / 5am PT daily
  workflow_dispatch: # manual trigger
    inputs:
      allow:
        description: >-
          Plausibility checks to waive after confirming the move is real
          (comma-separated: total-move, roster-churn, frozen-upstream)
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test the fetcher before touching data
        run: |
          python -m pip install pytest
          python -m pytest scripts -q

      - name: Fetch latest Forbes data
        run: python scripts/fetch_forbes.py

      - name: Sanity-check the new snapshot before publishing it
        env:
          SNAPSHOT_SANITY_ALLOW: ${{ inputs.allow }}
        run: python scripts/check_snapshot_sanity.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/billionaires_live.json data/billionaires_live_meta.json data/billionaires_live.csv data/roster_valuations.json public/snapshots/ public/roster_valuations/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Forbes data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # Nothing is published when a step above fails, so the site keeps the last
      # good data. Say so where someone will see it.
      - name: Open an issue if the update failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily Forbes update failed"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The run at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed, so no new snapshot was published and the site is serving the last good data. If the sanity gate tripped on a real event, rerun the workflow with the check named in its log in the \`allow\` input."
          fi
