name: Update Forbes data

on:
  schedule:
    - cron: "0 12 * * *" # 12pm UTC / 5am PT daily
  workflow_dispatch: # manual trigger
    inputs:
      allow:
        description: >-
          Plausibility checks to waive after confirming the move is real
          (comma-separated: total-move, roster-churn, frozen-upstream)
        required: false
        default: ""

# A manual dispatch would otherwise race the scheduled run to push. A new run
# waits for the one in progress instead of cancelling it; GitHub keeps only the
# newest waiting run, cancelling any older one still pending.
concurrency:
  group: update-forbes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch CI on the data commit
      contents: write
      issues: write
    steps:
      # The branch's tip when the job starts, not the commit the run was queued
      # for: the branch may have moved while the run waited for a runner, and
      # the tests, fetch and sanity gate should see the tree that gets
      # published. The workflow file itself still comes from the queued commit.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # scripts/test_precompute.py runs lib/incomeTaxLookup.js under bun to check
      # that the app can read the generated lookup. That module imports nothing,
      # so the runtime is enough; no `bun install`.
      - uses: oven-sh/setup-bun@v2

      - name: Test the fetcher before touching data
        run: |
          python -m pip install pytest
          python -m pytest scripts -q

      - name: Fetch latest Forbes data
        run: python scripts/fetch_forbes.py

      - name: Sanity-check the new snapshot before publishing it
        env:
          SNAPSHOT_SANITY_ALLOW: ${{ inputs.allow }}
        run: python scripts/check_snapshot_sanity.py

      - name: Commit and push if changed
        id: publish
        env:
          SNAPSHOT_SANITY_ALLOW: ${{ inputs.allow }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/billionaires_live.json data/billionaires_live_meta.json data/billionaires_live.csv data/roster_valuations.json data/citizenship_by_name.json public/snapshots/ public/roster_valuations/
          if git diff --cached --quiet; then
            # Forbes stamps every record with the time it served the payload,
            # so no change means it served the last payload again. That run is
            # good only while the data on the branch is still fresh.
            echo "No changes"
            python scripts/check_snapshot_freshness.py
          else
            git commit -m "Update Forbes data ($(date -u +%Y-%m-%d))"
            # Something may have landed since checkout. Put the data commit on
            # the branch's current tip and gate the tree that will be pushed. A
            # conflict, such as another data commit, fails the step. The rebase
            # needs a clean tree: every tracked file the fetcher writes is
            # staged above.
            git pull --rebase origin "$GITHUB_REF_NAME"
            python scripts/check_snapshot_sanity.py
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN starts no push run, so the data commit
      # would otherwise reach main with no lint, model tests, strict freshness
      # check or build. A workflow_dispatch event is the documented exception.
      # ci.yml reports the result on the outage issue itself; waiting for it
      # here would hold a runner while the CI run queues for one.
      - name: Run CI on the data commit
        if: steps.publish.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_COMMIT: ${{ steps.publish.outputs.sha }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" -f "inputs[data_commit]=$DATA_COMMIT" \
            -F return_run_details=true --jq '"CI run: \(.html_url)"'

      # scripts/report_daily_update.py keeps the outage issue; off main, such as
      # in a test dispatch on a branch, it prints what it would do instead. It
      # uses python3, which the runner has even if setup-python failed.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_COMMIT: ${{ steps.publish.outputs.sha }}
        run: >-
          python3 scripts/report_daily_update.py failure
          ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}

      # After a data commit, ci.yml closes the issue once CI passes on it.
      - name: Close the outage issue
        if: success() && steps.publish.outputs.sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/report_daily_update.py success
          ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
